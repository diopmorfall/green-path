<header class="bg-white py-4 shadow-md fixed top-0 left-0 right-0 z-50">
    <div class="container mx-auto flex items-center justify-between px-5 md:px-0">
        <div class="flex items-center">
            <img src="assets/images/greenpath-logo.svg" alt="GreenPath Logo" class="mr-2 h-10" />
            <span class="text-2xl font-bold text-green-500">GreenPath</span>
        </div>
        <nav class="hidden md:block">
        <ul class="flex space-x-5">
            <li><a href="#" class="header-menu-item">Soluzioni</a></li>
            <li><a href="#" class="header-menu-item">Come Funziona</a></li>
            <li><a href="#" class="header-menu-item">Vantaggi</a></li>
            <li><a href="#" class="header-menu-item">Testimonianze</a></li>
        </ul>
        </nav>
        <div class="hidden md:block">
            <button class="mr-3 rounded-md border-2 border-green-500 bg-transparent px-5 py-2 font-medium text-green-500 transition duration-300 hover:bg-green-500 hover:text-white">Accedi</button>
            <button class="rounded-md border-2 border-green-500 bg-green-500 px-5 py-2 font-medium text-white transition duration-300 hover:border-green-600 hover:bg-green-600">Inizia Ora</button>
        </div>
        <div class="md:hidden">
            <button (click)="toggleMobileMenu()" class="flex h-5 w-8 flex-col justify-around bg-transparent p-0">
                <span class="block h-0.5 w-full bg-gray-700 transition duration-300"></span>
                <span class="block h-0.5 w-full bg-gray-700 transition duration-300"></span>
                <span class="block h-0.5 w-full bg-gray-700 transition duration-300"></span>
            </button>
        </div>
    </div>
    <nav class="absolute left-0 top-16 w-full bg-white shadow-md md:hidden" [class.hidden]="!isMobileMenuOpen" [class.flex]="isMobileMenuOpen">
        <ul class="flex flex-col items-center py-5">
            <li><a href="#" class="block py-2 header-menu-item">Soluzioni</a></li>
            <li><a href="#" class="block py-2 header-menu-item">Come Funziona</a></li>
            <li><a href="#" class="block py-2 header-menu-item">Vantaggi</a></li>
            <li><a href="#" class="block py-2 header-menu-item">Testimonianze</a></li>
        </ul>
        <div class="flex flex-col items-center py-5">
            <button class="mb-3 w-4/5 rounded-md border-2 border-green-500 bg-transparent px-5 py-2 font-medium text-green-500 transition duration-300 hover:bg-green-500 hover:text-white">
                Accedi
            </button>
            <button class="w-4/5 rounded-md border-2 border-green-500 bg-green-500 px-5 py-2 font-medium text-white transition duration-300 hover:border-green-600 hover:bg-green-600">
                Inizia Ora
            </button>
        </div>
    </nav>
</header>
