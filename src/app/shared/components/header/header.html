<header class="w-full h-[8vh] bg-white p-4 md:p-8 flex-row justify-around shadow-md fixed top-0 left-0 right-0 z-10">
    <div class="container h-full mx-auto flex items-center justify-between px-3 md:px-0">
        <div class="flex items-center">
            <!--todo <img src="assets/images/greenpath-logo.svg" alt="GreenPath Logo" class="mr-2 h-10"/> -->
            <span class="text-2xl font-bold text-green-500">GreenPath</span>
        </div>
        <nav [ngClass]="{
                'hidden': isMobileView && !isMobileMenuOpen,
                'flex-row w-3/4 justify-around': !isMobileView,
                'flex-col justify-center py-5 absolute left-0 top-[7vh] w-full h-[50vh] space-y-5 text-xl': isMobileView
            }"
            class="flex items-center bg-white"
        >
            <ul [ngClass]="{
                    'flex-col space-y-5': isMobileView,
                    'flex-row space-x-5': !isMobileView,
                }"
                class="flex items-center justify-between"
            >
                <li><a href="#" class="header-menu-item">Solutions</a></li>
                <li><a href="#" class="header-menu-item">Technologies</a></li>
                <li><a href="#" class="header-menu-item">Benefits</a></li>
                <li><a href="#" class="header-menu-item">Success Stories</a></li>
            </ul>
            <div [ngClass]="{
                    'flex-col justify-center py-5 w-1/2': isMobileView,
                    'flex-row': !isMobileView
                }"
                class="flex items-center"
            >
                <button type="button" [ngClass]="{
                        'mb-5 w-full': isMobileView,
                        'mr-5': !isMobileView
                    }"
                    class="header-button bg-transparent text-green-500 hover:bg-green-500 hover:text-white"
                >
                    Login
                </button>
                <button type="button" [ngClass]="{'w-full': isMobileView}"
                    class="header-button bg-green-500 text-white hover:border-green-600"
                >
                    Get started
                </button>
            </div>
        </nav>
        <div *ngIf="isMobileView">
            <button (click)="toggleMobileMenu()" 
                    [attr.aria-expanded]="isMobileMenuOpen"
                    aria-label="Toggle navigation menu"
                    class="relative h-5 w-5 md:h-6 md:w-6 bg-transparent p-0">
                <img src="assets/icons/{{ isMobileMenuOpen ? 'close-icon' : 'hamburger-menu-icon' }}.svg" alt="Menu toggle" />
            </button>        </div>
    </div>
</header>
