<div class="w-full h-full flex flex-col items-center bg-white shadow-xl rounded-2xl">
    <div class="flex justify-between items-center w-full p-3">
        @for (stepLabel of formStepsLabels; track $index) {
            <div class="flex flex-col items-center flex-1">
                <div class="step-indicator"
                    [ngClass]="{'unreached-step': $index + 1 !== currentStep }"
                    [class.active-step]="$index + 1 === currentStep"
                >
                    {{$index + 1}}
                </div>
                <span class="step-title" [ngClass]="{'hidden-step-title': $index + 1 !== currentStep}">{{stepLabel}}</span>
            </div>
        }
    </div>

    <div class="flex justify-between w-full p-4 md:px-8 lg:px-12">
        <button class="hidden multistep-button border border-gray-300 text-gray-700">
            <img src="assets/icons/left-icon.svg" class="multistep-button-icon">
            <span>&nbsp;Indietro</span>
        </button>
        <button class="multistep-button bg-green-500 text-white">
            <span>Avanti&nbsp;</span>
            <img src="assets/icons/right-icon.svg" class="multistep-button-icon white-filter">
        </button>
    </div>
</div>
